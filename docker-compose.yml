
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricing-engine
    env_file:
      - .env
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      POSTGRES_DSN: postgres://pricing_user:pricing_password@postgres:5432/pricing_db?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricing_user
      POSTGRES_PASSWORD: pricing_password
      POSTGRES_DB: pricing_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing_user -d pricing_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
